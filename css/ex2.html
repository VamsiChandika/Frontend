<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration Form</title>
  <style>
    .color{
      background: darkblue;
      color:white;
      border: 2px solid darkblue;
    }
    body{
      background-color: skyblue;
    }
    table{
      border: 2px solid darkblue;
    }
  </style>
</head>
<body>
    <center>
      <h3>CUSTOMER REGISTRATION FORM</h3>
      <form align="center" action="serverurl" method="post" name="submit">
        <table bgcolor="white" align="center" border="2px" cellpadding="3px" cellspacing="3px">
          <tr>
            <td class="color"><label for="id1">Customer Name</label></td>
            <td><input type="text" placeholder="Enter Your Full Name" id="id1" name="name"></td>
          </tr>
          <tr>
            <td class="color"><label for="id2">Password</label></td>
            <ui>
              <td><input type="password" placeholder="Enter Password" id="id2" name="password"></td>
            </ui>
          </tr>
          <tr>
            <td class="color"><label for="id3">Confirm Password</label></td>
            <td><input type="password" placeholder="Re-Enter Password" id="id3" name="Confirmpassword">
            </td>
          </tr>
          <tr>
            <td class="color"><label for="id4">Email</label>
            </td>
            <td><input type="email" placeholder="Enter Email" id="id4" name="email">
            </td>
          </tr>
          <tr>
            <td class="color"><label for="id5">Mobile</label>
            </td>
            <td><input type="tel" placeholder="Enter Mobile Number" id="id5" name="mobile">
            </td>
          </tr>
          <tr>
            <td class="color"><label for="id6">Date Of Birth</label>
            </td>
            <td><input type="date" placeholder="Enter DOB" id="id6" name="DOB">
            </td>
          </tr>
          <tr>
            <td class="color"><label for="">Gender</label>
            </td>
            <td><input type="radio" Value="Male" id="gender1" name="gender"><label for="gender1">Male</label>
              <input type="radio" Value="Female"id="gender2" name="gender"><label for="gender2">Female</label>
              <input type="radio" Value="Others"id="gender3" name="gender"><label for="gender3">Others</label>
            </td>
          </tr>
          <tr>
            <td class="color"><label for="id7">Account Type</label>
            </td>
            <td><select name="accounttype" id="id7">
                <option value="Savings">Savings</option>
                <option value="Zero">Zero</option>
                <option value="Current">Current</option>
                <option value="Joint">Joint</option>
              </select></td>
          </tr>
          <tr>
            <td class="color"><label for="id8">Aadhar Number</label>
            </td>
            <td><input type="number" placeholder="xxxx-xxxx-xxxx" id="id8" name="aadharnumber">
            </td>
          </tr>
          <tr>
            <td class="color"><label for="id9">PAN upload</label>
            </td>
            <td><input type="file" id="id9" name="panupload">
            </td>
          </tr>
          <tr>
            <td class="color"><label for="id10">Address</label>
            </td>
            <td><textarea rows="5" cols="10" placeholder="#.........." id="id10" name="address"></textarea>
            </td>
          </tr>
          <tr>
            <td class="color"><label for="id11">Terms</label>
            </td>
            <td><input type="checkbox" value="I Agree" id="id11" name="terms">I Agree
            </td>
          </tr>
          <tr>
            
            <td colspan="2"><input type="submit" value="Submit">
              <input type="reset" value="Reset">
            </td>
          </tr>
        </table>
      </form>
    </center>
</body>

</html>
