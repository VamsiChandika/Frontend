<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //== means it changes type if both are not in same type
     document.write(10=="010")
     document.write(10=="20")
     document.write(10==10)
     document.write(10==20)
     document.write(10==false)
     document.write(10==true)
     document.write(0==true)
     document.write(23==false)
     document.write([]==false)
     document.write("<br>")
      //=== means it cannot changes type if both are not in same type directly gives false value
     document.write(10==="10")
     document.write("020"==="20")
     document.write(10===10)
     document.write(10===20)
     document.write(false===false)
     document.write(10===true)
     document.write(0===true)
     document.write(23===false)


  </script>
</body>
</html>
