<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Js Ex-1</title>
</head>

<body>
  <script>
    var n1, n2, n3, total, div;
    n1 = eval(prompt("Enter the n1 value:", ""))
    n2 = eval(prompt("Enter the n2 value:", ""))
    n3 = eval(prompt("Enter the n3 value:", ""))
    div = eval(prompt("Enter the div value:", ""))
    total = (n1 + n2 + n3) / div
    alert(total)
  </script>

</body>

</html>
