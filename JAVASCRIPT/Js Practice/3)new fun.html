<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    a = eval(prompt("a=", ""))
    b = eval(prompt("b=", ""))

    let man = function (n1, n2) {
      return n1 + n2
    }
    let van=(v1,v2)=> man(v1,v2)
    
    document.write(van(a, b))
  
  </script>

</body>

</html>
