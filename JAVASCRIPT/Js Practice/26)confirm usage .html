<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    fun1=()=>{
      if(document.getElementById("1").value===""){
        alert("1st num  should not be empty")
      }
      else if(document.getElementById("2").value===""){
        alert("2nd num  should not be empty")
      }
      else{
        document.getElementById("span1").innerHTML=`${eval(document.getElementById("1").value)+eval(document.getElementById("2").value)}`
      }
    }
    fun2=()=>{
      m=confirm("do u want to clear")
      if(m){
        document.getElementById("1").value=""
        document.getElementById("2").value=""
        document.getElementById("span1").innerHTML=""

      }
    }
  </script>
</head>
<body>
  <input type="text" id="1">
  <input type="text" id="2">
  <button onclick="fun1()">add</button>
  <span id="span1"></span>
  <button onclick="fun2()">
    clear
  </button>
  
</body>
</html>
