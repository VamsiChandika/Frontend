<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let array=[2,3,4,5,6,5,6,4,3]
    document.write(array+"<br>")
    let myset=new Set(array)
    
    document.write([...myset]+"<br>")
  let student={
       n1:35,
       n2:87,
       n:5,
       add:function(){document.write(this.n1+this.n2)},//if function is called as value in an object then it is called method()
       mul:function(){document.write(this.n*this.n1)},
       cub:function(){document.write(this.n*this.n*this.n)},
       square:function(){document.write(this.n*this.n)},
 

    }
    let mymap=new Map(Object.entries(student))
    mymap.set("nn",123)
    document.write(...mymap)
    document.write("<br>")
    document.write(JSON.stringify(Object.entries(student)))
    
  </script>
</body>
</html>
